name: Smoke tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-smoke:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Create venv & install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r octofit-tracker/backend/requirements.txt

      - name: Run migrations
        run: |
          . .venv/bin/activate
          python octofit-tracker/backend/manage.py migrate --noinput

      - name: Verify health URL is registered (Django URL resolve)
        run: |
          . .venv/bin/activate
          # Ensure the backend package directory is on PYTHONPATH so imports resolve
          export PYTHONPATH="$PWD/octofit-tracker/backend:$PYTHONPATH"
          python - <<'PY'
import os, sys
os.environ.setdefault('DJANGO_SETTINGS_MODULE','octofit_tracker.settings')
try:
    import django
    django.setup()
    from django.urls import resolve
    resolve('/api/health/')
    print('URL /api/health/ resolved successfully')
except Exception as e:
    print('URL resolution failed:', e)
    raise
PY

  frontend-smoke:
    name: Frontend smoke (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: npm install --prefix octofit-tracker/frontend

      - name: Build frontend
        run: npm run build --prefix octofit-tracker/frontend
