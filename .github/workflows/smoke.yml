name: Smoke tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-smoke:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Create venv & install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r octofit-tracker/backend/requirements.txt

      - name: Run migrations
        run: |
          . .venv/bin/activate
          python octofit-tracker/backend/manage.py migrate --noinput

      - name: Verify health endpoint with Django test client
        run: |
          . .venv/bin/activate
          # Ensure the backend package directory is on PYTHONPATH so imports resolve
          export PYTHONPATH="$PWD/octofit-tracker/backend:$PYTHONPATH"
          python - <<'PY'
import os, sys
os.environ.setdefault('DJANGO_SETTINGS_MODULE','octofit_tracker.settings')
try:
    import django
    django.setup()
    from django.test import Client
    c = Client()
    res = c.get('/api/health/')
    print('health status code:', res.status_code)
    print('health content:', res.content[:200])
    if res.status_code != 200:
        raise SystemExit(1)
except Exception as e:
    print('Health endpoint test failed:', repr(e))
    raise
PY

  frontend-smoke:
    name: Frontend smoke (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: npm install --prefix octofit-tracker/frontend

      - name: Build frontend
        run: npm run build --prefix octofit-tracker/frontend
